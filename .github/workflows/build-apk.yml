name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Generate Android native project (if missing)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Apply app icon
        run: |
          cp icon-assets/icon-mdpi.png   android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp icon-assets/icon-mdpi.png   android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp icon-assets/icon-hdpi.png   android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp icon-assets/icon-hdpi.png   android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp icon-assets/icon-xhdpi.png  android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp icon-assets/icon-xhdpi.png  android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp icon-assets/icon-xxhdpi.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp icon-assets/icon-xxhdpi.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp icon-assets/icon-xxxhdpi.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp icon-assets/icon-xxxhdpi.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyTracker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
